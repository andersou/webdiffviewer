name: CI and release

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: 1.25.4
  NODE_VERSION: 24.20.0

jobs:
  # Lint and test once, and build the frontend once: every binary embeds the same web/dist.
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # no go.sum: the module has no dependencies
      - name: Build and test the frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Check, vet and test Go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then printf 'gofmt needed:\n%s\n' "$unformatted" >&2; exit 1; fi
          go vet ./...
          go test ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - id: source
        name: Read immutable source metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # non-release builds are stamped with a dev version
          echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  release-plan:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'develop') }}
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm
        run: npm install --global npm@11.9.0
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - id: plan
        name: Calculate release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:dry-run

  build:
    needs: [quality, metadata, release-plan]
    if: ${{ always() && needs.quality.result == 'success' && needs.metadata.result == 'success' && (needs.release-plan.result == 'success' || needs.release-plan.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64, extension: "", archive: tar.gz }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, extension: "", archive: tar.gz }
          - { runner: windows-2025, goos: windows, goarch: amd64, extension: .exe, archive: zip }
          - { runner: windows-11-arm, goos: windows, goarch: arm64, extension: .exe, archive: zip }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64, extension: "", archive: tar.gz }
          - { runner: macos-15, goos: darwin, goarch: arm64, extension: "", archive: tar.gz }
    # native runners, so each binary is tested and executed on its own OS/arch
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test, build, and package
        shell: bash
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.release-plan.outputs.publish == 'true' && needs.release-plan.outputs.version || needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          go test ./...
          binary="webdiffviewer${{ matrix.extension }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$binary" ./cmd/webdiffviewer
          test "$(./"$binary" -version)" = "webdiffviewer $VERSION"
          archive="webdiffviewer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = zip ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$binary' -DestinationPath 'dist/$archive'"
          else
            tar -czf "dist/$archive" "$binary"
          fi
          if command -v sha256sum >/dev/null 2>&1; then digest=$(sha256sum "dist/$archive" | cut -d ' ' -f1); else digest=$(shasum -a 256 "dist/$archive" | cut -d ' ' -f1); fi
          printf '%s  %s\n' "$digest" "$archive" > "dist/$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ needs.release-plan.outputs.publish == 'true' }}
    needs: [metadata, release-plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Confirm branch head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote_head" = "${{ needs.metadata.outputs.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm
        run: npm install --global npm@11.9.0
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          archives=(dist/*.tar.gz dist/*.zip)
          test "${#archives[@]}" -eq 6
          sidecars=(dist/*.sha256)
          test "${#sidecars[@]}" -eq 6
          LC_ALL=C sort "${sidecars[@]}" > dist/SHA256SUMS
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Publish release
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release
